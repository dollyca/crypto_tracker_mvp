name: Daily Crypto Price Update

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0:00 執行
  workflow_dispatch:      # 可以手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run fetch script
        run: python fetch_crypto.py

      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/crypto_prices.csv
          git commit -m "auto: update crypto price" || echo "No changes"
          git push https://x-access-token:${GH_TOKEN}@github.com/dollyca/crypto_tracker_mvp.git HEAD:main
